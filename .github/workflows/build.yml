name: Build Volvex Debian Package

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'docs/**'
      - '**.png'
      - '**.svg'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev lintian fakeroot rsync

      - name: Read Version from Debian Changelog
        run: |
          DEB_VERSION=$(dpkg-parsechangelog -S Version)
          VOLVEX_VERSION=$(echo "$DEB_VERSION" | sed 's/-[^-]*$//')
          echo "DEB_VERSION=$DEB_VERSION" >> $GITHUB_ENV
          echo "VOLVEX_VERSION=$VOLVEX_VERSION" >> $GITHUB_ENV
          echo "Debian Version: $DEB_VERSION"
          echo "Upstream Version: $VOLVEX_VERSION"

      - name: Prepare Debian Build Environment
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          STRUCTURE_DIR="build_env/${REPO}-${VERSION}"

          mkdir -p "$STRUCTURE_DIR"
          rsync -a --exclude='.git' --exclude='build_env' ./ "$STRUCTURE_DIR/"

          cd build_env
          tar -cJf "${REPO}_${VERSION}.orig.tar.xz" \
            --exclude="${REPO}-${VERSION}/debian" \
            "${REPO}-${VERSION}/"

      - name: Build Binary Package
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          cd "build_env/${REPO}-${VERSION}"
          chmod +x debian/postinst debian/postrm debian/rules volvex
          debuild -b -us -uc

      - name: Build Source Package
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          cp "build_env/${REPO}_${VERSION}.orig.tar.xz" "build_env/"
          cd "build_env/${REPO}-${VERSION}"
          debuild -S -us -uc

      - name: Run Lintian
        run: |
          REPO="${{ github.event.repository.name }}"
          DEB_VERSION="${{ env.DEB_VERSION }}"
          lintian "build_env/${REPO}_${DEB_VERSION}_all.deb" || true
          lintian "build_env/${REPO}_${DEB_VERSION}.dsc" || true

      - name: Create Source Archives
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          mkdir -p build_env/sources
          git archive --format=zip --output="build_env/sources/${REPO}_${VERSION}_source.zip" HEAD
          git archive --format=tar.gz --output="build_env/sources/${REPO}_${VERSION}_source.tar.gz" HEAD

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.DEB_VERSION }}-build
          path: build_env/

      - name: Trigger apt-repo update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.APT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Rob1c/apt-repo/dispatches \
            -d '{
              "event_type": "new-package",
              "client_payload": {
                "repo": "volvex",
                "run_id": "${{ github.run_id }}",
                "package": "${{ github.event.repository.name }}-${{ env.DEB_VERSION }}-build"
              }
            }'
