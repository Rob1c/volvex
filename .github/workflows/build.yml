name: Build Volvex Debian Package

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'docs/**'
      - '**.png'
      - '**.svg'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev lintian fakeroot rsync jq wget

      - name: Read Version from Debian Changelog
        run: |
          DEB_VERSION=$(dpkg-parsechangelog -S Version)
          VOLVEX_VERSION=$(echo "$DEB_VERSION" | sed 's/-[^-]*$//')

          # save env vars in Actions
          echo "DEB_VERSION=$DEB_VERSION" >> $GITHUB_ENV
          echo "VOLVEX_VERSION=$VOLVEX_VERSION" >> $GITHUB_ENV

          echo "=== Info Versione Rilevata ==="
          echo "Debian Version: $DEB_VERSION"
          echo "Upstream Version: $VOLVEX_VERSION"

      - name: Fetch Latest Mimage Release
        id: mimage_api
        run: |
          JSON=$(curl -s https://api.github.com/repos/Rob1c/Mimage/releases/latest)
          MIMAGE_VERSION=$(echo "$JSON" | jq -r '.tag_name' | sed 's/^v//')
          MIMAGE_DEB_URL=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url')

          echo "version=$MIMAGE_VERSION" >> $GITHUB_OUTPUT
          echo "deb_url=$MIMAGE_DEB_URL" >> $GITHUB_OUTPUT
          echo "MIMAGE_VERSION=$MIMAGE_VERSION" >> $GITHUB_ENV

      - name: Download and Extract Mimage
        run: |
          wget "${{ steps.mimage_api.outputs.deb_url }}" -O mimage.deb
          dpkg-deb -x mimage.deb mimage_extracted
          cp mimage_extracted/usr/bin/mimage ./mimage
          cp mimage_extracted/usr/lib/mimage/Macintosh.exe ./Macintosh.exe
          chmod +x mimage Macintosh.exe

      - name: Prepare Debian Build Environment
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          STRUCTURE_DIR="build_env/${REPO}-${VERSION}"

          mkdir -p "$STRUCTURE_DIR"

          rsync -a --exclude='.git' --exclude='build_env' --exclude='mimage.deb' --exclude='mimage_extracted' ./ "$STRUCTURE_DIR/"

          cd build_env
          tar -cJf "${REPO}_${VERSION}.orig.tar.xz" \
            --exclude="${REPO}-${VERSION}/debian" \
            "${REPO}-${VERSION}/"

      - name: Build Debian Package
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          cd "build_env/${REPO}-${VERSION}"
          chmod +x debian/postinst debian/postrm debian/rules volvex
          debuild -b -us -uc

      - name: Debug - List build output
        if: always()
        run: |
          echo "=== build_env ==="
          ls -lah build_env/
          find . -name "*.deb" | xargs ls -lah 2>/dev/null || echo "No .deb found"

      - name: Create Source Archives
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION="${{ env.VOLVEX_VERSION }}"
          mkdir -p build_env/sources
          git archive --format=zip --output="build_env/sources/${REPO}_${VERSION}_source.zip" HEAD
          git archive --format=tar.gz --output="build_env/sources/${REPO}_${VERSION}_source.tar.gz" HEAD

      - name: Upload Artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.DEB_VERSION }}-build
          path: build_env/

      - name: Trigger apt-repo update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.APT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Rob1c/apt-repo/dispatches \
            -d '{
              "event_type": "new-package",
              "client_payload": {
                "repo": "volvex",
                "run_id": "${{ github.run_id }}",
                "package": "${{ github.event.repository.name }}-${{ env.DEB_VERSION }}-build"
              }
            }'
